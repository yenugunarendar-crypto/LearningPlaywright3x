name: Run Selected JavaScript Scripts

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Run HelloWorld script
        run: |
          echo "Starting HelloWorld.js..."
          node Chapter_01_JS_basics/01_HelloWorld.js
          echo "Script finished!"

      - name: Run NewTest script
        run: |
          echo "Starting NewTest.js..."
          node Chapter_01_JS_basics/03_newtest.js
          echo "Script finished!"
